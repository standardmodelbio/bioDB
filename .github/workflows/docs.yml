name: Docs

# Validate docs and execute offline tutorials on pull requests. Pushes to main
# also publish the rendered site to GitHub Pages.
#
# One-time setup: Settings → Pages → Source → "GitHub Actions".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/_static/coverage.svg'
      - 'docs/_static/docker.svg'
  workflow_dispatch: {}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Check notebook validation regressions
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate and execute offline tutorials
        run: python scripts/validate_notebooks.py --execute
      - name: Build documentation with warnings treated as errors
        run: sphinx-build -W --keep-going -b html -d docs/_build/doctrees docs docs/_build/html
      - run: touch docs/_build/html/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
